<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Bolos da Tia Selma</title>
  <style>
    body {
      font-family: Arial;
      background: #fff8f0;
      text-align: center;
    }

    h1 {
      color: #8B0000;
    }

    .produto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 20px;
      display: inline-block;
      width: 250px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .preco {
      font-size: 20px;
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

    .botao {
      display: inline-block;
      padding: 10px 15px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .botao:hover {
      background: #1ebe5d;
    }
  </style>
</head>

<body>

<h1>Bolos Caseiros da Tia Selma 🍰</h1>
<p>Feitos com amor direto para sua família ❤️</p>

<!-- PRODUTO 1 -->
<div class="produto">
  <img src="img/bolo1.jpg">
  <h3>Bolo de Chocolate</h3>
  <p class="preco">R$ 30,00</p>
  <a class="botao" href="https://wa.me/5591999999999" target="_blank">
    Pedir no WhatsApp
  </a>
</div>

<!-- PRODUTO 2 -->
<div class="produto">
  <img src="img/bolo2.jpg">
  <h3>Bolo de Cenoura</h3>
  <p class="preco">R$ 25,00</p>
  <a class="botao" href="https://wa.me/5591999999999" target="_blank">
    Pedir no WhatsApp
  </a>
</div>

<!-- NOVO PRODUTO (VOCÊ PEDIU ISSO) -->
<div class="produto">
  <img src="img/bolo3.jpg">
  <h3>Bolo de Milho</h3>
  <p class="preco">R$ 28,00</p>
  <a class="botao" href="https://wa.me/5591999999999" target="_blank">
    Pedir no WhatsApp
  </a>
</div>

</body>
</html>
